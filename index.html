<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CambioCuba | Precio del USD, EUR y MLC en Cuba</title>
  <meta name="description" content="Precio actualizado del Dólar, Euro y MLC en el mercado informal cubano.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --text-soft: #64748b;
      --border: #e2e8f0;
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --gradient-soft: linear-gradient(135deg, rgba(99,102,241,.1) 0%, rgba(139,92,246,.1) 100%);
      --green: #10b981;
      --red: #ef4444;
      --shadow: 0 10px 40px rgba(99, 102, 241, .1);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #0a0a1a;
      --surface: #14142b;
      --text: #f1f5f9;
      --text-soft: #94a3b8;
      --border: #2a2a4a;
      --gradient-soft: linear-gradient(135deg, rgba(99,102,241,.2) 0%, rgba(139,92,246,.2) 100%);
      --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .3s, color .3s;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.5px;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: .2s;
    }

    .theme-btn:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow);
    }

    /* HERO */
    .hero {
      padding: 60px 0 40px;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    .hero h1 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--text-soft);
      font-size: 1.05rem;
      max-width: 550px;
      margin: 0 auto 20px;
      line-height: 1.6;
    }


    /* TARJETAS DE MONEDAS */
    .monedas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .moneda-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: .3s;
      position: relative;
      overflow: hidden;
    }

    .moneda-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient);
    }

    .moneda-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow);
    }

    .moneda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .moneda-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--gradient-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .moneda-nombre {
      text-align: right;
    }

    .moneda-nombre .code {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .moneda-nombre .name {
      font-size: .8rem;
      color: var(--text-soft);
    }

    .moneda-precio {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
      line-height: 1;
    }

    .moneda-cup {
      color: var(--text-soft);
      font-size: .9rem;
      margin-bottom: 14px;
    }

    .moneda-cambio {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: .82rem;
      font-weight: 700;
    }

    .moneda-cambio.up {
      background: rgba(16, 185, 129, .1);
      color: var(--green);
    }

    .moneda-cambio.down {
      background: rgba(239, 68, 68, .1);
      color: var(--red);
    }

    .moneda-cambio.equal {
      background: rgba(148, 163, 184, .15);
      color: var(--text-soft);
    }

    /* CONVERSOR */
    .conversor {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      margin-bottom: 60px;
    }

    .conversor h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 20px;
      letter-spacing: -.5px;
    }

    .conv-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .conv-item {
      display: flex;
      gap: 8px;
    }

    .conv-input {
      flex: 1;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      transition: border .2s;
      width: 100%;
    }

    .conv-input:focus {
      border-color: var(--primary);
    }

    .conv-select {
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      font-family: inherit;
    }

    .conv-arrow {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--gradient);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    
    /* COMPARTIR */
    .compartir {
      background: var(--gradient);
      color: white;
      border-radius: var(--radius);
      padding: 40px 30px;
      text-align: center;
      margin-bottom: 40px;
    }

    .compartir h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .compartir p {
      opacity: .9;
      margin-bottom: 24px;
    }

    .btn-wa {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: white;
      color: #25d366;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: .2s;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-wa:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
    }

    /* FOOTER */
    .footer {
      padding: 30px 0;
      text-align: center;
      color: var(--text-soft);
      font-size: .85rem;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-soft);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media(max-width: 640px) {
      .conv-row {
        grid-template-columns: 1fr;
      }
      .conv-arrow {
        margin: 0 auto;
        transform: rotate(90deg);
      }
      .moneda-precio {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="wrap header-inner">
      <div class="logo">💱 CambioCuba</div>
      <button class="theme-btn" id="themeBtn" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Precio del <span>Dólar, Euro y MLC</span><br>en Cuba hoy</h1>
      <p>Tasas actualizadas del mercado informal cubano. Datos de elToque.</p>
    </section>

    <section class="monedas" id="monedas">
      <div class="loading">
        <div class="spinner"></div>
        <p>Cargando tasas...</p>
      </div>
    </section>

    <section class="conversor">
      <h2>💱 Conversor</h2>
      <div class="conv-row">
        <div class="conv-item">
          <input type="number" class="conv-input" id="convInput" value="100" min="0">
          <select class="conv-select" id="convFrom">
            <option value="USD">USD</option>
            <option value="ECU">EUR</option>
            <option value="MLC">MLC</option>
            <option value="CUP">CUP</option>
          </select>
        </div>
        <div class="conv-arrow">→</div>
        <div class="conv-item">
          <input type="number" class="conv-input" id="convOutput" readonly>
          <select class="conv-select" id="convTo">
            <option value="CUP">CUP</option>
            <option value="USD">USD</option>
            <option value="ECU">EUR</option>
            <option value="MLC">MLC</option>
          </select>
        </div>
      </div>
    </section>

    

    <section class="compartir">
      <h2>Comparte con tus amigos</h2>
      <p>Ayuda a más personas a conocer las tasas del día</p>
      <button class="btn-wa" id="btnCompartir">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
        Compartir por WhatsApp
      </button>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>© 2026 CambioCuba · Datos de <a href="https://eltoque.com" target="_blank">elToque</a></p>
    </div>
  </footer>

  <script>
    const WORKER_URL = "https://tasas-eltoque.leorrmrval.workers.dev/";
    
    let datosGlobal = null;
    
    const MONEDAS = {
      USD: { icon: "💵", nombre: "Dólar EE.UU.", key: "USD" },
      EUR: { icon: "💶", nombre: "Euro", key: "ECU" },
      MLC: { icon: "💳", nombre: "MLC", key: "MLC" }
    };

    // TEMA OSCURO/CLARO
    const themeBtn = document.getElementById('themeBtn');
    const tema = localStorage.getItem('tema') || 'light';
    document.documentElement.setAttribute('data-theme', tema);
    themeBtn.textContent = tema === 'dark' ? '☀️' : '🌙';

    themeBtn.addEventListener('click', () => {
      const actual = document.documentElement.getAttribute('data-theme');
      const nuevo = actual === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nuevo);
      themeBtn.textContent = nuevo === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('tema', nuevo);
        });

    // CARGAR TASAS
    async function cargar() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();
        datosGlobal = data;
        
        renderMonedas(data);
        actualizarConversor();
        
      } catch (error) {
        document.getElementById('monedas').innerHTML = '<p style="text-align:center;color:var(--red)">Error cargando datos</p>';
      }
    }

    function renderMonedas(data) {
      const contenedor = document.getElementById('monedas');
      contenedor.innerHTML = '';
      
      Object.keys(MONEDAS).forEach(code => {
        const info = MONEDAS[code];
        const precioHoy = data.actual?.tasas[info.key];
        const precioAyer = data.ayer?.tasas[info.key];
        
        if (!precioHoy) return;
        
        const diff = precioAyer ? (precioHoy - precioAyer) : 0;
        const clase = diff > 0 ? 'up' : diff < 0 ? 'down' : 'equal';
        const flecha = diff > 0 ? '▲' : diff < 0 ? '▼' : '=';
        const signo = diff > 0 ? '+' : '';
        
        contenedor.innerHTML += `
          <div class="moneda-card">
            <div class="moneda-header">
              <div class="moneda-icon">${info.icon}</div>
              <div class="moneda-nombre">
                <div class="code">1 ${code}</div>
                <div class="name">${info.nombre}</div>
              </div>
            </div>
            <div class="moneda-precio">${precioHoy.toFixed(2)}</div>
            <div class="moneda-cup">CUP · Peso Cubano</div>
            <div class="moneda-cambio ${clase}">
              ${flecha} ${signo}${diff.toFixed(2)} vs ayer
            </div>
          </div>
        `;
      });
    }


    // CONVERSOR
    function actualizarConversor() {
      const cantidad = parseFloat(document.getElementById('convInput').value) || 0;
      const de = document.getElementById('convFrom').value;
      const a = document.getElementById('convTo').value;
      
      if (!datosGlobal?.actual?.tasas) return;
      
      const tasas = datosGlobal.actual.tasas;
      let enCUP;
      
      // Convertir origen a CUP
      if (de === 'CUP') enCUP = cantidad;
      else enCUP = cantidad * (tasas[de] || 1);
      
      // Convertir CUP a destino
      let resultado;
      if (a === 'CUP') resultado = enCUP;
      else resultado = enCUP / (tasas[a] || 1);
      
      document.getElementById('convOutput').value = resultado.toFixed(2);
    }

    document.getElementById('convInput').addEventListener('input', actualizarConversor);
    document.getElementById('convFrom').addEventListener('change', actualizarConversor);
    document.getElementById('convTo').addEventListener('change', actualizarConversor);

    
    // COMPARTIR
    document.getElementById('btnCompartir').addEventListener('click', () => {
      if (!datosGlobal?.actual?.tasas) return;
      const t = datosGlobal.actual.tasas;
      const fecha = new Date().toLocaleDateString('es-CU', { day: 'numeric', month: 'long' });
      
      const msg = `💱 *Tasas de cambio en Cuba - ${fecha}*%0A%0A` +
        `💵 USD: ${t.USD} CUP%0A` +
        `💶 EUR: ${t.ECU} CUP%0A` +
        `💳 MLC: ${t.MLC} CUP%0A%0A` +
        `Ver más en: https://leo12105.github.io/cambiocuba/`;
      
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    });

    cargar();
  </script>
</body>
</html>
